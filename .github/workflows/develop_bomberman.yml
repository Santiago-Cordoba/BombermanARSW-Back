name: Build, Analyze, and Deploy

on:
  push:
    branches:
      - develop  # Análisis y despliegue en develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para análisis preciso

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Tests with JaCoCo
        run: mvn -B test -f arsw/pom.xml # Genera el reporte jacoco.xml

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd arsw  # Entramos al directorio del proyecto
          mvn -B sonar:sonar \
            -Dsonar.projectKey=Santiago-Cordoba_BombermanARSW-Back \
            -Dsonar.organization=santiago-cordoba \
            -Dsonar.branch.name=develop \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.sourceEncoding=UTF-8

  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    needs: sonarcloud-analysis  # Espera a que el análisis de SonarCloud termine
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'

      - name: Build with Maven
        run: mvn -f arsw/pom.xml clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
             name: java-app
             path: 'arsw/target/*.jar'

  deploy:
           runs-on: ubuntu-latest
           needs: build
           environment:
             name: 'Production'
             url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
           permissions:
             id-token: write
             contents: read

           steps:
             - name: Download artifact from build job
               uses: actions/download-artifact@v4
               with:
                 name: java-app

             - name: Login to Azure
               uses: azure/login@v2
               with:
                 client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8F0A6C6DE40244388B6D1A3059542F36 }}
                 tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8B19E710E569470E922B7FB9DDAF0513 }}
                 subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C79D61A1EB5F4DDD9C0B44D496830173 }}

             - name: Deploy to Azure Web App
               id: deploy-to-webapp
               uses: azure/webapps-deploy@v3
               with:
                 app-name: 'Bomberman'
                 slot-name: 'Production'
                 package: '*.jar'